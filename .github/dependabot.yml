version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Runtime dependencies are pinned exactly on purpose, so version updates are
    # limited to development dependencies. `allow` does not suppress security
    # updates: a vulnerable runtime package still gets a pull request.
    allow:
      - dependency-type: development
    groups:
      development:
        update-types: ["minor", "patch"]

  # The Dockerfile and compose.yaml are pinned by digest, which by design never
  # moves on its own. Without these two entries the pinned Node and PostgreSQL
  # images would stay frozen and stop receiving security rebuilds.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: "/scripts/excel"
    schedule:
      interval: monthly
