version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Runtime deps are pinned exactly on purpose; review these one by one.
      production:
        dependency-type: production
        update-types: ["security"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: "/scripts/excel"
    schedule:
      interval: monthly
