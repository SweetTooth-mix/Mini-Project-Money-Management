name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time placeholder only; no query runs during `next build`.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kira_rapi

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  container:
    name: Container image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira_ci_password
          POSTGRES_DB: kira_rapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_rapi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi
    steps:
      - uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build --target runner --tag kira-rapi:ci .

      - name: Build migration image
        run: docker build --target migrate --tag kira-rapi:migrate .

      - name: Apply migrations
        run: |
          docker run --rm --network host             --env DATABASE_URL             kira-rapi:migrate npx prisma migrate deploy

      - name: Seed a demo organisation
        run: |
          docker run --rm --network host             --env DATABASE_URL             --env SEED_DEMO=true             --env SEED_ADMIN_PASSWORD=ci-password-12345             --env SEED_REVIEWER_PASSWORD=ci-password-12345             kira-rapi:migrate npx tsx prisma/seed.ts

      - name: Start the application container
        run: |
          docker run --detach --name kira-rapi-ci --network host             --env DATABASE_URL             --env APP_URL=http://127.0.0.1:3000             kira-rapi:ci

      - name: Wait for a healthy container
        run: |
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' kira-rapi-ci)"
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then
              docker logs kira-rapi-ci
              exit 1
            fi
            sleep 5
          done
          echo "Container did not become healthy in time" >&2
          docker logs kira-rapi-ci
          exit 1

      - name: Check the reporting toolchain inside the image
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/health | tee health.json
          node -e "const r=require('./health.json'); if (r.checks.reports !== 'ok') { console.error('reporting toolchain missing:', r); process.exit(1); }"

      - name: Check the login page renders
        run: curl --fail --silent --output /dev/null http://127.0.0.1:3000/login

      - name: Container logs
        if: always()
        run: docker logs kira-rapi-ci || true

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira_ci_password
          POSTGRES_DB: kira_rapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_rapi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi_test
      DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create test database
        run: PGPASSWORD=kira_ci_password psql -h 127.0.0.1 -U kira -d kira_rapi -c 'CREATE DATABASE kira_rapi_test'

      - name: Integration tests
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration.log

      # Job logs are not always reachable from every environment; surface the
      # failing assertions as check-run annotations too.
      - name: Report failing assertions
        if: failure()
        run: |
          body="$(grep -A 25 "^not ok" integration.log | head -c 12000 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          echo "::error::${body}"
