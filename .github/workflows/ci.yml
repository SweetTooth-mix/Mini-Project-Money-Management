name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time placeholder only; no query runs during `next build`.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kira_rapi

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  reports:
    name: Excel and PDF reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The generator builds real workbooks and asks LibreOffice for the PDF, so
      # these tests need the same toolchain the server uses.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreoffice-calc-nogui fonts-liberation python3-venv

      - name: Create the Python environment
        run: npm run setup:reports

      - name: Report tests
        run: npm run test:reports

  accessibility:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira_ci_password
          POSTGRES_DB: kira_rapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_rapi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi
      # The suite creates its own kira_rapi_e2e_test database; there is no
      # docker compose project inside the job.
      E2E_SKIP_COMPOSE_DB: "true"
      # No LibreOffice or Python virtualenv in this job; the container job
      # covers the reporting toolchain instead.
      E2E_SKIP_REPORTS: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs migrate reset, the demo seed, the Playwright suite and the axe
      # audits against the isolated E2E database.
      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            .data/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # The documentation screenshots (docs/screenshots) are regenerated from
      # this artefact instead of a maintainer's laptop, so the README never
      # shows an interface the code no longer renders.
      - name: Upload documentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: .data/screenshots/docs/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira_ci_password
          POSTGRES_DB: kira_rapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_rapi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi
      METRICS_TOKEN: ci-metrics-token-0123456789
    steps:
      - uses: actions/checkout@v5

      - name: Resolve base image digest
        run: |
          for image in node:22-bookworm-slim postgres:16; do
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
            echo "::warning::DIGEST ${image} ${digest}"
          done

      - name: Build runtime image
        run: docker build --target runner --tag kira-rapi:ci .

      - name: Build migration image
        run: docker build --target migrate --tag kira-rapi:migrate .

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            --env DATABASE_URL \
            kira-rapi:migrate npx prisma migrate deploy

      - name: Seed a demo organisation
        run: |
          set -o pipefail
          docker run --rm --network host \
            --env DATABASE_URL \
            --env SEED_DEMO=true \
            --env SEED_ADMIN_PASSWORD=ci-password-12345 \
            --env SEED_REVIEWER_PASSWORD=ci-password-12345 \
            kira-rapi:migrate npx tsx prisma/seed.ts 2>&1 | tee seed.log

      - name: Start the application container
        run: |
          docker run --detach --name kira-rapi-ci --network host \
            --env DATABASE_URL \
            --env APP_URL=http://127.0.0.1:3000 \
            --env METRICS_TOKEN \
            kira-rapi:ci

      - name: Wait for a healthy container
        run: |
          for attempt in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' kira-rapi-ci)"
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then
              docker logs kira-rapi-ci
              exit 1
            fi
            sleep 5
          done
          echo "Container did not become healthy in time" >&2
          docker logs kira-rapi-ci
          exit 1

      - name: Check the reporting toolchain inside the image
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/health | tee health.json
          node -e "const r=require('./health.json'); if (r.checks.reports !== 'ok') { console.error('reporting toolchain not ready:', JSON.stringify(r)); process.exit(1); }"

      - name: Check the login page renders
        run: curl --fail --silent --output /dev/null http://127.0.0.1:3000/login

      # Verifies the HTTP timing patch really runs inside the production server,
      # not just in unit tests: the request above must appear in the exposition.
      - name: Check metrics are scrapeable
        run: |
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/login
          curl --fail --silent -H "Authorization: Bearer $METRICS_TOKEN" \
            http://127.0.0.1:3000/api/metrics | tee metrics.txt
          grep -q 'kira_http_requests_total{method="GET",route="/login",status="2xx"}' metrics.txt
          grep -q 'kira_http_request_duration_seconds_bucket{method="GET",route="/login"' metrics.txt
          grep -q 'kira_process_uptime_seconds' metrics.txt

      - name: Check metrics reject an unauthenticated scrape
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/metrics)"
          test "$status" = "401" || { echo "expected 401, got $status" >&2; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs kira-rapi-ci || true

      # Job logs are not reachable from every environment; surface the failure
      # as a check-run annotation as well.
      - name: Report failure details
        if: failure()
        run: |
          body="$( { docker logs kira-rapi-ci 2>&1 || true; cat seed.log 2>/dev/null || true; } | tail -n 120 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          echo "::error::${body}"

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira_ci_password
          POSTGRES_DB: kira_rapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_rapi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi_test
      DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create test database
        run: PGPASSWORD=kira_ci_password psql -h 127.0.0.1 -U kira -d kira_rapi -c 'CREATE DATABASE kira_rapi_test'

      - name: Integration tests
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration.log

      # Job logs are not always reachable from every environment; surface the
      # failing assertions as check-run annotations too.
      - name: Report failing assertions
        if: failure()
        run: |
          body="$(grep -A 25 "^not ok" integration.log | head -c 12000 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }')"
          echo "::error::${body}"
