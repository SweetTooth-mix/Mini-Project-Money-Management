name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time placeholder only; no query runs during `next build`.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kira_rapi

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira_ci_password
          POSTGRES_DB: kira_rapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_rapi"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi_test
      DATABASE_URL: postgresql://kira:kira_ci_password@127.0.0.1:5432/kira_rapi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create test database
        run: PGPASSWORD=kira_ci_password psql -h 127.0.0.1 -U kira -d kira_rapi -c 'CREATE DATABASE kira_rapi_test'

      - name: Integration tests
        run: npm run test:integration
